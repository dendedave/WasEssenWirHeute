<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Sucuk oder Hasushi?</title>
  <style>
    :root { color-scheme: dark; --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --muted:#cbd5e1; --accent:#f59e0b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,Segoe UI,sans-serif; color:var(--text); background:radial-gradient(circle at top,#334155 0,#0f172a 55%); }
    main { width:min(100%,560px); padding:36px 28px 28px; text-align:center; background:rgba(30,41,59,.94); border:1px solid rgba(255,255,255,.12); border-radius:28px; box-shadow:0 24px 70px rgba(0,0,0,.35); }
    .emoji { font-size:4rem; line-height:1; }
    h1 { margin:18px 0 8px; font-size:clamp(2rem,8vw,3.5rem); letter-spacing:-.04em; }
    p { margin:0 0 28px; color:var(--muted); }
    .choices { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:22px 0; }
    .choice { padding:22px 10px; border-radius:18px; background:#334155; font-size:1.25rem; font-weight:700; transition:.2s; }
    .choice.active { background:var(--accent); color:#111827; transform:scale(1.03); }
    button { width:100%; border:0; border-radius:14px; padding:15px 18px; font:inherit; font-weight:800; cursor:pointer; color:#111827; background:var(--accent); transition:transform .15s, filter .15s; }
    button:hover { filter:brightness(1.08); transform:translateY(-1px); }
    button:active { transform:translateY(1px); }
    #result { min-height:55px; margin:22px 0 18px; font-size:clamp(1.8rem,7vw,2.8rem); font-weight:900; }
    .secondary { color:var(--text); background:#475569; font-size:.95rem; }
    .hint { margin:18px 0 0; font-size:.8rem; color:#94a3b8; }
    @media (max-width:400px) { main { padding:28px 18px 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="emoji">🤔</div>
    <h1>Sucuk oder Hasushi?</h1>
    <p>Keine Lust zu entscheiden? Lass den Zufall ran.</p>
    <div class="choices" aria-label="Auswahlmöglichkeiten">
      <div class="choice" id="sucuk">🌯 Sucuk</div>
      <div class="choice" id="hasushi">🍣 Hasushi</div>
    </div>
    <button id="decide">Entscheidung treffen</button>
    <div id="result" aria-live="polite">❔</div>
    <button class="secondary" id="share">🔗 Link kopieren</button>
    <div class="hint" id="status">Teile diese Seite mit deinen Freunden.</div>
  </main>
  <script>
    const options = [
      { name: 'Sucuk', id: 'sucuk' },
      { name: 'Hasushi', id: 'hasushi' }
    ];
    const result = document.querySelector('#result');
    const status = document.querySelector('#status');
    const decide = document.querySelector('#decide');
    const share = document.querySelector('#share');

    function randomIndex() {
      const values = new Uint32Array(1);
      crypto.getRandomValues(values);
      return values[0] % options.length;
    }

    function choose() {
      decide.disabled = true;
      result.textContent = '…';
      document.querySelectorAll('.choice').forEach(el => el.classList.remove('active'));
      setTimeout(() => {
        const selected = options[randomIndex()];
        result.textContent = selected.name + '!';
        document.querySelector('#' + selected.id).classList.add('active');
        decide.disabled = false;
      }, 450);
    }

    async function copyLink() {
      try {
        await navigator.clipboard.writeText(location.href);
        status.textContent = 'Link kopiert – jetzt kannst du ihn teilen!';
      } catch {
        status.textContent = 'Kopiere den Link aus der Adresszeile deines Browsers.';
      }
    }

    decide.addEventListener('click', choose);
    share.addEventListener('click', copyLink);
  </script>
</body>
</html>
